name: Construire APK NIMBA LIVRAISON

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Construire
        run: |
          flutter create --platforms=android nimba_app
          cp webview_main.dart nimba_app/lib/main.dart
          cp webview_pubspec.yaml nimba_app/pubspec.yaml

          python3 - <<'PY'
          from pathlib import Path
          p = Path("nimba_app/android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = s.replace(
              '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
              '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n'
              '    <uses-permission android:name="android.permission.INTERNET"/>\n'
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n'
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>'
          )
          s = s.replace('android:label="nimba_app"', 'android:label="NIMBA LIVRAISON"')
          p.write_text(s)
          PY

          cd nimba_app
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: NIMBA-LIVRAISON-APK
          path: nimba_app/build/app/outputs/flutter-apk/app-release.apk
