      - name: Construire
        run: |
          flutter create --platforms=android nimba_app
          cp webview_main.dart nimba_app/lib/main.dart
          cp webview_pubspec.yaml nimba_app/pubspec.yaml

          sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />' nimba_app/android/app/src/main/AndroidManifest.xml

          cd nimba_app
          flutter pub get
          flutter build apk --release
